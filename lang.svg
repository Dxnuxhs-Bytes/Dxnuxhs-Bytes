<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 420 282"
     width="420"
     height="282"
     role="img"
     aria-label="Top languages">

<defs>

<style><![CDATA[
text{
  font-family:SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace
}

@keyframes cardIn{
  0%{opacity:0;transform:scale(.94)}
  70%{opacity:1}
  100%{opacity:1;transform:scale(1)}
}

@keyframes borderGlow{
  0%,100%{opacity:.35}
  50%{opacity:.85}
}

@keyframes titleGlow{
  0%,100%{filter:drop-shadow(0 0 2px rgba(245,158,11,.35))}
  50%{filter:drop-shadow(0 0 8px rgba(217,70,239,.75))}
}

@keyframes fadeUp{
  from{opacity:0;transform:translateX(-10px)}
  to{opacity:1;transform:translateX(0)}
}

@keyframes pop{
  0%{opacity:0;transform:scale(0)}
  55%{opacity:1;transform:scale(1.45)}
  75%{transform:scale(.85)}
  100%{transform:scale(1)}
}

@keyframes segPop{
  0%{opacity:0;transform:scaleY(.2)}
  55%{opacity:1;transform:scaleY(1.35)}
  100%{opacity:1;transform:scaleY(1)}
}

@keyframes sparkFlash{
  0%{opacity:0;transform:scale(.3)}
  30%{opacity:1;transform:scale(1.7)}
  70%{opacity:.9;transform:scale(1)}
  100%{opacity:0;transform:scale(.4)}
}

@keyframes shineX{
  0%{transform:translateX(-140px)}
  60%,100%{transform:translateX(460px)}
}

@keyframes twinkle{
  0%,100%{opacity:0;transform:scale(.3)}
  50%{opacity:1;transform:scale(1)}
}

@keyframes ringPulse{
  0%{opacity:.9;transform:scale(.4)}
  100%{opacity:0;transform:scale(2.6)}
}

@keyframes floaty{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-4px)}
}

.card{
  transform-origin:210px 141px;
  animation:cardIn .6s cubic-bezier(.34,1.4,.4,1) forwards
}

.borderpulse{
  animation:borderGlow 3s ease-in-out infinite
}

.title{
  transform-origin:0 0;
  animation:titleGlow 3.2s ease-in-out 1.2s infinite
}

.row{
  opacity:0;
  animation:fadeUp .55s cubic-bezier(.22,.9,.3,1.2) forwards
}

.icon{
  transform-box:fill-box;
  transform-origin:center;
  opacity:0;
  animation:pop .6s cubic-bezier(.3,1.6,.4,1) forwards
}

.seg{
  transform-box:fill-box;
  transform-origin:bottom;
  opacity:0;
  animation:segPop .38s ease-out forwards
}

.spark{
  transform-box:fill-box;
  transform-origin:center;
  opacity:0;
  animation:sparkFlash .7s ease-out forwards
}

.sh{
  animation:shineX 4.5s ease-in-out 2.6s infinite
}

.tw{
  transform-box:fill-box;
  transform-origin:center;
  animation:twinkle 2.6s ease-in-out infinite
}

.ring{
  transform-box:fill-box;
  transform-origin:center;
  animation:ringPulse 1.6s ease-out infinite
}

.float{
  animation:floaty 3.4s ease-in-out infinite
}
]]></style>

<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#f59e0b">
    <animate attributeName="stop-color"
             values="#f59e0b;#d946ef;#6366f1;#f59e0b"
             dur="6s"
             repeatCount="indefinite"/>
  </stop>

  <stop offset="100%" stop-color="#6366f1">
    <animate attributeName="stop-color"
             values="#6366f1;#f59e0b;#d946ef;#6366f1"
             dur="6s"
             repeatCount="indefinite"/>
  </stop>
</linearGradient>

<linearGradient id="shg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
  <stop offset="50%" stop-color="#fff" stop-opacity=".08"/>
  <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</linearGradient>

<radialGradient id="bgglow">
  <stop offset="0%" stop-color="#d946ef" stop-opacity=".13"/>
  <stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
</radialGradient>

<filter id="glow"
        x="-50%"
        y="-50%"
        width="200%"
        height="200%">
  <feGaussianBlur stdDeviation="2.2" result="b"/>
  <feMerge>
    <feMergeNode in="b"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<filter id="borderblur"
        x="-20%"
        y="-20%"
        width="140%"
        height="140%">
  <feGaussianBlur stdDeviation="4.5"/>
</filter>

<clipPath id="cardc">
  <rect x="1" y="1" width="418" height="280" rx="14"/>
</clipPath>

</defs>

<g class="card">

<!-- OUTER NEON GLOW -->
<rect class="borderpulse"
      x="1"
      y="1"
      width="418"
      height="280"
      rx="14"
      fill="none"
      stroke="url(#tg)"
      stroke-width="7"
      filter="url(#borderblur)"/>

<!-- MAIN CARD -->
<rect x="1"
      y="1"
      width="418"
      height="280"
      rx="14"
      fill="#1e1033"
      stroke="url(#tg)"
      stroke-width="3.5"/>

<!-- INNER BORDER -->
<rect x="6"
      y="6"
      width="408"
      height="270"
      rx="10"
      fill="none"
      stroke="url(#tg)"
      stroke-width="1"
      stroke-opacity=".45"/>

<!-- BACKGROUND GLOW -->
<circle class="float"
        cx="210"
        cy="141"
        r="150"
        fill="url(#bgglow)"/>

<!-- STARS -->
<g clip-path="url(#cardc)">

<g class="tw">
  <animateTransform attributeName="transform"
