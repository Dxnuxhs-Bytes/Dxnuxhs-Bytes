                    values=".3;1;.3"
                    dur="2.6s"
                    repeatCount="indefinite"/>
  <path d="M388 24l2.2 5.8 5.8 2.2-5.8 2.2-2.2 5.8-2.2-5.8-5.8-2.2 5.8-2.2z"
        fill="#fbbf24"/>
</g>

<g class="tw">
  <path d="M20 250l2 5.4 5.4 2-5.4 2-2 5.4-2-5.4-5.4-2 5.4-2z"
        fill="#e879f9"/>
</g>

<g class="tw">
  <path d="M402 200l1.8 4.8 4.8 1.8-4.8 1.8-1.8 4.8-1.8-4.8-4.8-1.8 4.8-1.8z"
        fill="#818cf8"/>
</g>

</g>

<!-- TITLE -->
<g class="title" filter="url(#glow)">
<text x="20"
      y="34"
      font-size="16"
      font-weight="bold"
      fill="url(#tg)">📊 Top Languages</text>
</g>

<text x="396"
